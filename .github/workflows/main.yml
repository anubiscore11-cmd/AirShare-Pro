name: Convertir HTML en APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 2. Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Créer l'architecture complète AndroidX
        run: |
          mkdir -p android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/java/com/airshare/pro/services
          mkdir -p android-app/app/src/main/java/com/airshare/pro/receivers
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/xml

      - name: 4. Injecter ton interface index.html d'origine
        run: |
          cat << 'EOF' > android-app/app/src/main/assets/www/index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
          <meta name="color-scheme" content="dark">
          <title>AirShare Pro</title>
          <style>
            *, *::before, *::after {
              box-sizing: border-box;
              margin: 0;
              padding: 0;
              -webkit-tap-highlight-color: transparent;
              -webkit-touch-callout: none;
              -webkit-user-select: none;
              user-select: none;
            }
            :root {
              --bg-amoled:       #050508;
              --bg-layer1:       #0a0a12;
              --bg-layer2:       #0f0f1a;
              --glass-bg:        rgba(255, 255, 255, 0.06);
              --glass-bg-deep:   rgba(255, 255, 255, 0.04);
              --glass-bg-hover:  rgba(255, 255, 255, 0.10);
              --glass-border:    rgba(255, 255, 255, 0.12);
              --glass-border-hi: rgba(255, 255, 255, 0.22);
              --blur-sm:         blur(12px);
              --blur-md:         blur(24px);
              --blur-lg:         blur(40px);
              --accent-blue:     #4FC3F7;
              --accent-purple:   #CE93D8;
              --accent-green:    #80CBC4;
              --accent-orange:   #FFCC80;
              --accent-red:      #EF9A9A;
              --text-primary:    rgba(255, 255, 255, 0.95);
              --text-secondary:  rgba(255, 255, 255, 0.55);
              --text-tertiary:   rgba(255, 255, 255, 0.30);
              --radius-md:       18px;
              --radius-lg:       24px;
              --radius-xl:       32px;
              --radius-pill:     999px;
              --safe-top:        env(safe-area-inset-top, 48px);
              --safe-bottom:     env(safe-area-inset-bottom, 24px);
            }
            html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-amoled); color: var(--text-primary); font-family: -apple-system, sans-serif; }
            .ambient-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
            .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18; }
            .orb-1 { width: 380px; height: 380px; top: -120px; left: -80px; background: radial-gradient(circle, #4FC3F7, transparent 70%); }
            .orb-2 { width: 320px; height: 320px; bottom: -100px; right: -60px; background: radial-gradient(circle, #CE93D8, transparent 70%); }
            .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; padding-top: calc(var(--safe-top) + 8px); padding-bottom: calc(var(--safe-bottom) + 8px); }
            .header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 16px; }
            .header-title { font-size: 20px; font-weight: 700; }
            .mode-section { padding: 0 20px 20px; }
            .mode-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .mode-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 6px; border-radius: var(--radius-md); background: var(--glass-bg); border: 1.5px solid var(--glass-border); color: #fff; text-align: center; }
            .mode-btn.active { border-color: var(--glass-border-hi); background: var(--glass-bg-hover); }
            .main-section { flex: 1; padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
            .drop-zone { border-radius: var(--radius-xl); background: var(--glass-bg-deep); border: 2px dashed var(--glass-border); padding: 32px 24px; text-align: center; }
          </style>
          <script>
            function triggerFilePicker() { if(window.Android) { window.Android.openFilePicker(); } }
            function selectMode(btn) { document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
          </script>
          </head>
          <body>
            <div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
            <div class="app">
              <div class="header">
                <div><div class="header-title">AirShare Pro</div></div>
              </div>
              <div class="mode-section">
                <div class="mode-grid">
                  <div class="mode-btn active" onclick="selectMode(this)"><div>📶</div><div>Wi-Fi</div></div>
                  <div class="mode-btn" onclick="selectMode(this)"><div>🔥</div><div>Hotspot</div></div>
                  <div class="mode-btn" onclick="selectMode(this)"><div>🔵</div><div>Bluetooth</div></div>
                  <div class="mode-btn" onclick="selectMode(this)"><div>🔌</div><div>Câble</div></div>
                </div>
              </div>
              <div class="main-section">
                <div class="drop-zone" onclick="triggerFilePicker()">
                  <div style="font-size:32px; margin-bottom:10px;">📂</div>
                  <div><b>Sélectionner un fichier</b></div>
                  <div style="font-size:12px; opacity:0.6; margin-top:5px;">Appuyez pour choisir depuis votre appareil</div>
                </div>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: 5. Injecter l'interface graphique XML manquante
        run: |
          cat << 'EOF' > android-app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_matrix"
              android:layout_height="match_parent"
              android:background="#050508">
              <webkit.WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/xml/file_provider_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="."/>
              <cache-path name="cache_files" path="."/>
          </paths>
          EOF

      - name: 6. Configurer Gradle avec AndroidX & Dépendances
        run: |
          echo "include ':app'" > android-app/settings.gradle
          echo "android.useAndroidX=true" > android-app/gradle.properties
          echo "android.enableJetifier=true" >> android-app/gradle.properties

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.airshare.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.airshare.pro"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
          }
          EOF

      - name: 7. Injecter ton AndroidManifest.xml d'origine
        run: |
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.airshare.pro">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-permission
                  android:name="android.permission.NEARBY_WIFI_DEVICES"
                  android:usesPermissionFlags="neverForLocation"
                  tools:targetSdkVersion="33" />

              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" tools:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />

              <application
                  android:allowBackup="true"
                  android:label="AirShare Pro"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.airshare.pro.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_provider_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: 8. Injecter une version stable et compatible de MainActivity.java
        run: |
          cat << 'EOF' > android-app/app/src/main/java/com/airshare/pro/MainActivity.java
          package com.airshare.pro;

          import android.Manifest;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private final static int REQUEST_FILE_PICKER = 1002;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Choisir un fichier"), REQUEST_FILE_PICKER);
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void openFilePicker() {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("*/*");
                              startActivityForResult(Intent.createChooser(intent, "Choisir un fichier"), REQUEST_FILE_PICKER);
                          });
                      }
                  }, "Android");

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      ActivityCompat.requestPermissions(this, new String[]{
                              Manifest.permission.NEARBY_WIFI_DEVICES,
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT
                      }, 1001);
                  }

                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQUEST_FILE_PICKER) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) {
                              results = new Uri[]{Uri.parse(dataString)};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }
          }
          EOF

      - name: 9. Compiler l'APK AirShare Pro
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleRelease

      - name: 10. Télécharger l'APK Final AirShare Pro
        uses: actions/upload-artifact@v4
        with:
          name: AirShare-Pro-Final-App
          path: android-app/app/build/outputs/apk/release/app-release.apk
