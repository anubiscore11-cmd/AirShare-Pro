name: Convertir HTML en APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Recuperer le code du depot
        uses: actions/checkout@v4

      - name: 2. Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Creer l'architecture exacte pour AirShare Pro
        run: |
          mkdir -p android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/java/com/airshare/pro

      - name: 4. Injecter ton code index.html
        run: |
          cat << 'EOF' > android-app/app/src/main/assets/www/index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
          <meta name="color-scheme" content="dark">
          <title>AirShare Pro</title>
          <style>
            *, *::before, *::after {
              box-sizing: border-box;
              margin: 0;
              padding: 0;
              -webkit-tap-highlight-color: transparent;
              -webkit-touch-callout: none;
              -webkit-user-select: none;
              user-select: none;
            }

            :root {
              --bg-amoled:       #050508;
              --bg-layer1:       #0a0a12;
              --bg-layer2:       #0f0f1a;
              --glass-bg:        rgba(255, 255, 255, 0.06);
              --glass-bg-deep:   rgba(255, 255, 255, 0.04);
              --glass-bg-hover:  rgba(255, 255, 255, 0.10);
              --glass-border:    rgba(255, 255, 255, 0.08);
            }
            body {
              background-color: var(--bg-amoled);
              color: #ffffff;
              font-family: -apple-system, SF Pro Display, Roboto, sans-serif;
            }
          </style>
          </head>
          <body>
            <div style="padding: 50px; text-align: center;">
              <h2>⚡ AirShare Pro</h2>
              <p style="margin-top: 20px; opacity: 0.6;">Interface iOS 26 Glassmorphism activée.</p>
            </div>
          </body>
          </html>
          EOF

      - name: 5. Generer les configurations Gradle (Package Pro)
        run: |
          echo "include ':app'" > android-app/settings.gradle

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.airshare.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.airshare.pro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: 6. Injecter ton AndroidManifest.xml d'origine
        run: |
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.airshare.pro">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-permission
                  android:name="android.permission.NEARBY_WIFI_DEVICES"
                  android:usesPermissionFlags="neverForLocation"
                  tools:targetSdkVersion="33" />

              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="AirShare Pro"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: 7. Injecter ton MainActivity.java d'origine
        run: |
          cat << 'EOF' > android-app/app/src/main/java/com/airshare/pro/MainActivity.java
          package com.airshare.pro;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends Activity {

              private WebView mWebView;
              private ValueCallback<Uri[]> mUploadMessage;
              private final static int FILECHOOSER_RESULTCODE = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  mWebView = new WebView(this);
                  setContentView(mWebView);

                  WebSettings webSettings = mWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);

                  mWebView.setWebViewClient(new WebViewClient());

                  mWebView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                          if (mUploadMessage != null) {
                              mUploadMessage.onReceiveValue(null);
                          }
                          mUploadMessage = filePathCallback;

                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Choisir un fichier"), FILECHOOSER_RESULTCODE);
                          return true;
                      }
                  });

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      ActivityCompat.requestPermissions(this, new String[]{
                              Manifest.permission.NEARBY_WIFI_DEVICES,
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT
                      }, 100);
                  }

                  mWebView.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (mUploadMessage == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) {
                              results = new Uri[]{Uri.parse(dataString)};
                          }
                      }
                      mUploadMessage.onReceiveValue(results);
                      mUploadMessage = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }
          }
          EOF

      - name: 8. Generer l'icone adaptative iOS 26 Glassmorphism
        run: |
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable

          cat << 'EOF' > android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050508</color>
          </resources>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M34,44 L66,44 L54,32 M66,44 L54,56"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round">
                  <aapt:attr name="android:strokeColor">
                      <gradient android:startX="34" android:startY="44" android:endX="66" android:endY="44" android:type="linear">
                          <item android:offset="0.0" android:color="#FF2563EB"/>
                          <item android:offset="1.0" android:color="#FF6366F1"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:pathData="M74,64 L42,64 L54,76 M42,64 L54,52"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round">
                  <aapt:attr name="android:strokeColor">
                      <gradient android:startX="74" android:startY="64" android:endX="42" android:endY="64" android:type="linear">
                          <item android:offset="0.0" android:color="#FFEC4899"/>
                          <item android:offset="1.0" android:color="#FF6366F1"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

      - name: 9. Compiler l'APK AirShare Pro Real
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleRelease

      - name: 10. Telecharger l'APK Final AirShare Pro
        uses: actions/upload-artifact@v4
        with:
          name: AirShare-Pro-Final-App
          path: android-app/app/build/outputs/apk/release/app-release.apk
